<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; color: #0f2f4f; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { font-size: 11.5px; color: #5b7186; line-height: 1.8; margin: 0 0 10px; }
      label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; padding: 7px; border-radius: 8px; border: 1px solid rgba(15,47,79,.2); }
      button { width: 100%; margin-top: 10px; border: 0; border-radius: 9px; padding: 9px; font: inherit; font-weight: 800; color: #fff; background: #0f2f4f; cursor: pointer; }
      .ok { font-size: 11px; color: #1d6b45; font-weight: 800; margin-top: 8px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>نسق — تحضير سريع</h1>
    <p>افتح نسق وسجّل الدخول، وهتلاقي زرار <strong>حضّر أسبوعي</strong> أسفل الصفحة.</p>
    <label for="apiBase">عنوان الـ API</label>
    <input id="apiBase" type="url" placeholder="https://api.nasaq…" />
    <button id="save">حفظ</button>
    <div class="ok" id="ok"></div>
    <script src="popup.js"></script>
  </body>
</html>
